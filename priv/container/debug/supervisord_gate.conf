[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisord.sock

[unix_http_server]
file=/tmp/supervisord.sock

# Cloud gate only -- runs in skyport-dev-gate (sibling of skyport-dev in the pod).
[program:swm-gate]
directory=%(ENV_SWM_GATE_DIR)s
command=bash run.sh
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/tmp/swm-cloud-gate-debug.log
environment=SWM_CLOUD_GATE_CONFIG="%(ENV_SWM_CLOUD_GATE_CONFIG)s",HOME="%(ENV_HOME)s"
