[supervisord]
nodaemon=false
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisord.sock

[unix_http_server]
file=/tmp/supervisord.sock

# swm-core only -- cloud gate runs in the sibling pod container (skyport-dev-gate).
[program:swm-core]
command=./scripts/run-swm-in-container.sh
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/tmp/swm-core.log
user={{ USERNAME }}
environment=SWM_CLOUD_GATE_CONFIG="/home/{{ USERNAME }}/.swm/cloud-gate.yaml",HOME="/home/{{ USERNAME }}"
