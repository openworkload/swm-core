[supervisord]
nodaemon=false

# swm-core only -- cloud gate runs in the sibling pod container (skyport-gate).
[program:swm-core]
command=/opt/swm/current/scripts/run-swm-in-container.sh
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/swm-core.log
user={{ USERNAME }}
environment=HOME="/home/{{ USERNAME }}",SWM_CLOUD_GATE_CONFIG="/home/{{ USERNAME }}/.swm/cloud-gate.yaml"
