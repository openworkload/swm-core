# Prometheus scrape config for Sky Port control plane.
# When running inside skyport-dev-pod, SWM metrics are on the shared netns.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: skyport
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9568
        labels:
          component: skyport
