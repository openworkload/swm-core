# Prometheus scrape config for Sky Port control plane (podman compose).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: skyport
    metrics_path: /metrics
    static_configs:
      - targets:
          - skyport-dev:9568
          - skyport:9568
        labels:
          component: skyport
