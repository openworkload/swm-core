name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

env:
  PYTHON_VERSION: 3.10
  PYTHON_VERSION_FULL: 3.10.17

jobs:

  unit_tests:
    runs-on: ubuntu-24.04
    container:
      image: erlang:29.1
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Compile
        run: make compile
      -
        name: Run unit tests
        run: make test_unit

  common_tests:
    runs-on: ubuntu-24.04
    container:
      image: erlang:29.1
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Install Python dependencies
        run: |
          apt-get update
          apt-get install -y build-essential zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev
          apt-get install -y libreadline-dev libffi-dev libsqlite3-dev wget libbz2-dev
      -
        name: Download Python sources
        run: |
          # We cannot use actions/setup-python, because it cannot install new python in the erlang image
          wget https://www.python.org/ftp/python/${{env.PYTHON_VERSION_FULL}}/Python-${{env.PYTHON_VERSION_FULL}}.tgz
          tar -xf Python-${{env.PYTHON_VERSION_FULL}}.tgz
      -
        name: Compile and install Python
        run: |
          cd Python-${{env.PYTHON_VERSION_FULL}}
          ./configure --enable-optimizations
          make -j $(nproc)
          make altinstall
          ln -s /usr/local/bin/python${{env.PYTHON_VERSION}} /usr/local/bin/python
          ln -s /usr/local/bin/pip${{env.PYTHON_VERSION}} /usr/local/bin/pip
      -
        name: Compile SWM
        run: |
          make compile
          make release
      -
        name: Prepate cloud gate
        run: |
          git config --global url.https://github.com/.insteadOf git://github.com/
          mkdir _build/ct-tests
          git clone https://github.com/openworkload/swm-cloud-gate.git _build/ct-tests/swm-cloud-gate
          ls -l _build/ct-tests
          cd _build/ct-tests/swm-cloud-gate
          make prepare-venv
          . .venv/bin/activate
      -
        name: Generate keys
        run: |
          useradd test
          cat /etc/passwd
          export USER=test
          ./scripts/setup-skyport-dev.sh
      -
        name: Run ct tests
        run: |
          export SWM_GATE_DIR=$(pwd)/_build/ct-tests/swm-cloud-gate
          make test_ct

  podman_smoke:
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Install Podman and crun
        run: |
          # GHA runners have sudo; plain ubuntu images used by act run as root without sudo.
          if command -v sudo >/dev/null 2>&1 && [[ "$(id -u)" -ne 0 ]]; then
            SUDO=sudo
          else
            SUDO=
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y podman crun uidmap slirp4netns fuse-overlayfs curl python3
      -
        name: Configure rootless Podman (crun)
        run: |
          if command -v sudo >/dev/null 2>&1 && [[ "$(id -u)" -ne 0 ]]; then
            SUDO=sudo
          else
            SUDO=
          fi
          mkdir -p ~/.config/containers
          # Nested-friendly defaults (act runs inside Docker); GHA bare metal still works.
          printf '%s\n' '[engine]' 'runtime = "crun"' 'cgroup_manager = "cgroupfs"' 'events_logger = "file"' \
            > ~/.config/containers/containers.conf
          printf '%s\n' '[storage]' 'driver = "vfs"' > ~/.config/containers/storage.conf
          # Ensure subuid/subgid for the runner user (Ubuntu images usually have them)
          grep -q "^$(id -un):" /etc/subuid || echo "$(id -un):100000:65536" | $SUDO tee -a /etc/subuid
          grep -q "^$(id -un):" /etc/subgid || echo "$(id -un):100000:65536" | $SUDO tee -a /etc/subgid
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          # Prefer user socket; fall back to foreground service (act / no systemd user session)
          if systemctl --user enable --now podman.socket 2>/dev/null; then
            sleep 2
          elif [[ ! -S "$XDG_RUNTIME_DIR/podman/podman.sock" ]]; then
            podman system service --time=0 "unix://$XDG_RUNTIME_DIR/podman/podman.sock" &
            for _ in $(seq 1 30); do
              [[ -S "$XDG_RUNTIME_DIR/podman/podman.sock" ]] && break
              sleep 0.5
            done
          fi
          test -S "$XDG_RUNTIME_DIR/podman/podman.sock"
      -
        name: Rootless Podman libpod smoke
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          export PODMAN_NESTED=1
          ./scripts/ci-podman-smoke.sh
