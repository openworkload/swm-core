# Control-plane add-ons (Prometheus). Requires an existing Podman network from
# Phase 0 scripts (skyportnet-dev for make cr / skyport-dev).
#
# Usage:
#   make cr                 # or otherwise start skyport-dev on skyportnet-dev
#   make prometheus-up
#   make prometheus-down

services:
  prometheus:
    image: docker.io/prom/prometheus:v2.55.1
    container_name: swm-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./priv/container/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - skyportnet-dev

networks:
  skyportnet-dev:
    external: true
    name: skyportnet-dev

volumes:
  prometheus_data:
